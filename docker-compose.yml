version: "3.9"

# Compliance Copilot — local dev stack
# Assumes Ollama is running on the HOST machine (not inside Docker).
# The backend reaches the host via host.docker.internal:11434.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    ports:
      - "8000:8000"
    environment:
      # Pull everything from the project root .env (mounted below)
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./label-lens-ai
      dockerfile: Dockerfile
    container_name: cc-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    env_file:
      - ./label-lens-ai/.env.local
    depends_on:
      - backend
    volumes:
      - ./label-lens-ai:/app
      - /app/node_modules
      - /app/.next
